name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Check SDK worker syntax
        run: node --check scripts/codex-sdk-worker.mjs

      - name: Check whitespace
        run: git diff --check

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, linux, x64, codex-family-prod, codex-family]
    timeout-minutes: 20

    steps:
      - name: Deploy tested Gateway commit
        env:
          CODEX_FAMILY_EXPECTED_SHA: ${{ github.sha }}
        run: /bin/bash /home/feiyan/workspace/codex-family/deploy/deploy.sh better-subagent

      - name: Deployment summary
        run: |
          echo "### Better Subagent deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- host: vimo-dev-server" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
